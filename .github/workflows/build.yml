name: Build Minimal FFmpeg

on:
  workflow_dispatch:
    inputs:
      build_windows_x86_64:
        description: 'Windows x86_64 (.exe)'
        type: boolean
        default: true
      build_windows_arm64:
        description: 'Windows ARM64 (.exe)'
        type: boolean
        default: true
      build_linux_x86_64:
        description: 'Linux x86_64 (static)'
        type: boolean
        default: true
      build_linux_arm64:
        description: 'Linux ARM64 (static)'
        type: boolean
        default: false
      build_macos_universal:
        description: 'macOS Universal (Apple Silicon + Intel)'
        type: boolean
        default: true
      build_macos_arm64:
        description: 'macOS Apple Silicon (arm64 only)'
        type: boolean
        default: false
      create_release:
        description: 'Publish GitHub Release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. WINDOWS (x86_64 via llvm-mingw)
  # ============================================================================
  build-windows-x86_64:
    name: Windows x86_64
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_windows_x86_64 == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install llvm-mingw toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm pkg-config zip git
          LLVM_MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/20240917/llvm-mingw-20240917-ucrt-ubuntu-20.04-x86_64.tar.xz"
          curl -fsSL "$LLVM_MINGW_URL" | tar -xJ -C /tmp
          echo "/tmp/llvm-mingw-20240917-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH

      - name: Build Windows x86_64 FFmpeg
        run: |
          chmod +x scripts/*.sh
          ARCH=x86_64 bash scripts/build-windows.sh

      - name: Package Windows x86_64 Binary
        run: |
          cd dist
          zip -9 ffmpeg-windows-x86_64.zip ffmpeg-windows-x86_64.exe ffmpeg.exe

      - name: Upload Windows x86_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-x86_64
          path: dist/ffmpeg-windows-x86_64.zip
          retention-days: 14

  # ============================================================================
  # 2. WINDOWS (ARM64 via llvm-mingw)
  # ============================================================================
  build-windows-arm64:
    name: Windows ARM64
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_windows_arm64 == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install llvm-mingw toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm pkg-config zip git
          LLVM_MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/20240917/llvm-mingw-20240917-ucrt-ubuntu-20.04-x86_64.tar.xz"
          curl -fsSL "$LLVM_MINGW_URL" | tar -xJ -C /tmp
          echo "/tmp/llvm-mingw-20240917-ucrt-ubuntu-20.04-x86_64/bin" >> $GITHUB_PATH

      - name: Build Windows ARM64 FFmpeg
        run: |
          chmod +x scripts/*.sh
          ARCH=arm64 bash scripts/build-windows.sh

      - name: Package Windows ARM64 Binary
        run: |
          cd dist
          zip -9 ffmpeg-windows-arm64.zip ffmpeg-windows-arm64.exe

      - name: Upload Windows ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-arm64
          path: dist/ffmpeg-windows-arm64.zip
          retention-days: 14

  # ============================================================================
  # 3. LINUX (x86_64 Static Build)
  # ============================================================================
  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_linux_x86_64 == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm yasm pkg-config git

      - name: Build Linux x86_64 FFmpeg
        run: |
          chmod +x scripts/*.sh
          ARCH=x86_64 bash scripts/build-linux.sh

      - name: Verify Linux x86_64 FFmpeg
        run: |
          bash scripts/verify.sh ./dist/ffmpeg-linux-x86_64

      - name: Package Linux x86_64 Binary
        run: |
          cd dist
          tar -czf ffmpeg-linux-x86_64.tar.gz ffmpeg-linux-x86_64 ffmpeg

      - name: Upload Linux x86_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-x86_64
          path: dist/ffmpeg-linux-x86_64.tar.gz
          retention-days: 14

  # ============================================================================
  # 4. LINUX (ARM64 Cross-Compilation)
  # ============================================================================
  build-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_linux_arm64 == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu nasm yasm pkg-config git

      - name: Build Linux ARM64 FFmpeg
        run: |
          chmod +x scripts/*.sh
          ARCH=arm64 bash scripts/build-linux.sh

      - name: Package Linux ARM64 Binary
        run: |
          cd dist
          tar -czf ffmpeg-linux-arm64.tar.gz ffmpeg-linux-aarch64 ffmpeg

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-arm64
          path: dist/ffmpeg-linux-arm64.tar.gz
          retention-days: 14

  # ============================================================================
  # 5. macOS (Universal on Apple Silicon)
  # ============================================================================
  build-macos:
    name: macOS Build
    runs-on: macos-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_macos_universal == 'true' || github.event.inputs.build_macos_arm64 == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install nasm yasm pkg-config git

      - name: Build macOS Universal Binary
        if: ${{ github.event_name == 'push' || github.event.inputs.build_macos_universal == 'true' }}
        run: |
          chmod +x scripts/*.sh
          ARCH=universal bash scripts/build-macos.sh
          bash scripts/verify.sh ./dist/ffmpeg-macos-universal
          cd dist
          tar -czf ffmpeg-macos-universal.tar.gz ffmpeg-macos-universal ffmpeg

      - name: Upload macOS Universal Artifact
        if: ${{ github.event_name == 'push' || github.event.inputs.build_macos_universal == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-universal
          path: dist/ffmpeg-macos-universal.tar.gz
          retention-days: 14

      - name: Build macOS ARM64 Binary
        if: ${{ github.event.inputs.build_macos_arm64 == 'true' }}
        run: |
          chmod +x scripts/*.sh
          ARCH=arm64 bash scripts/build-macos.sh
          bash scripts/verify.sh ./dist/ffmpeg-macos-arm64
          cd dist
          tar -czf ffmpeg-macos-arm64.tar.gz ffmpeg-macos-arm64 ffmpeg

      - name: Upload macOS ARM64 Artifact
        if: ${{ github.event.inputs.build_macos_arm64 == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos-arm64
          path: dist/ffmpeg-macos-arm64.tar.gz
          retention-days: 14

  # ============================================================================
  # 6. RELEASE (Collect all artifacts & Publish GitHub Release)
  # ============================================================================
  release:
    name: Create GitHub Release
    needs: [build-windows-x86_64, build-windows-arm64, build-linux-x86_64, build-linux-arm64, build-macos]
    if: |
      always() &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(date +'%Y.%m.%d-%H%M')"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release_artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: FFmpeg Minimal Audio Build ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release_artifacts/*
          body: |
            ### Minimal FFmpeg Audio-Only Build (${{ steps.release_info.outputs.tag }})
            
            Ultra-lightweight FFmpeg binaries tailored for audio remuxing, decoding, and transcoding.
            
            #### Included Platforms:
            - Windows x86_64 (`ffmpeg-windows-x86_64.zip`)
            - Windows ARM64 (`ffmpeg-windows-arm64.zip`)
            - Linux x86_64 (`ffmpeg-linux-x86_64.tar.gz`)
            - Linux ARM64 (`ffmpeg-linux-arm64.tar.gz`)
            - macOS Universal: Apple Silicon + Intel (`ffmpeg-macos-universal.tar.gz`)
            
            #### Included Components:
            - **Decoders**: Dolby Atmos / E-AC-3 JOC, AC-3, AAC, FLAC, MP3, ALAC, Opus, Vorbis, PCM (s16/s24/s32/f32)
            - **Encoders**: FLAC (24-bit s32), libmp3lame (MP3 320k), PCM (s16/s24)
            - **Containers**: MP4 / M4A (ISO-BMFF DASH chunks), FLAC, MP3, WAV, OGG
            - **Filters**: aresample, aformat, anull, swresample
            
            #### Checksums:
            Check `SHA256SUMS.txt` for integrity verification.
